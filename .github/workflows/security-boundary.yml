name: Security boundary checks

on:
  pull_request:
    branches:
      - Road-Hawk
  push:
    branches:
      - Road-Hawk

permissions:
  contents: read

jobs:
  road-hawk-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Road Hawk and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run security and API tests
        run: pytest -q tests/test_auth.py tests/test_api.py
