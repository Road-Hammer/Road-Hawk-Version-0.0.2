[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "road-hawk"
version = "0.1.0"
description = "Road Hawk by Road Hammer — fleet and driver operations for Susquehanna Timberwolf Lines LLC"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Susquehanna Timberwolf Lines LLC" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[project.scripts]
road-hawk = "road_hawk.cli:main"
road-hawk-api = "road_hawk.api_server:main"

[tool.setuptools.packages.find]
where = ["src"]